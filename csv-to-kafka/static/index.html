<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV to Kafka</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f1117;
            color: #e1e4e8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #1c1f26;
            border-radius: 12px;
            padding: 40px;
            width: 460px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #8b949e;
            font-size: 0.9rem;
            margin-bottom: 28px;
        }
        .drop-zone {
            border: 2px dashed #30363d;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            margin-bottom: 20px;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #58a6ff;
            background: rgba(88,166,255,0.05);
        }
        .drop-zone p {
            color: #8b949e;
            margin-bottom: 8px;
        }
        .drop-zone .filename {
            color: #58a6ff;
            font-weight: 600;
            margin-top: 12px;
        }
        input[type="file"] { display: none; }
        button {
            width: 100%;
            padding: 12px;
            background: #238636;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #2ea043; }
        button:disabled {
            background: #21262d;
            color: #484f58;
            cursor: not-allowed;
        }
        .progress-container {
            margin-top: 20px;
            display: none;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #21262d;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .progress-fill {
            height: 100%;
            background: #58a6ff;
            border-radius: 4px;
            width: 0%;
            transition: width 0.3s;
        }
        .progress-text {
            color: #8b949e;
            font-size: 0.85rem;
        }
        .result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }
        .result.success {
            background: rgba(35,134,54,0.15);
            border: 1px solid #238636;
            color: #3fb950;
        }
        .result.error {
            background: rgba(248,81,73,0.15);
            border: 1px solid #f85149;
            color: #f85149;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CSV to Kafka</h1>
        <p class="subtitle">Upload a CSV file to send its rows to Kafka</p>

        <div class="drop-zone" id="dropZone">
            <p>Drag & drop a CSV file here or click to browse</p>
            <div class="filename" id="fileName"></div>
        </div>
        <input type="file" id="fileInput" accept=".csv">

        <button id="sendBtn" disabled>Send to Kafka</button>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">Sending...</div>
        </div>

        <div class="result" id="result"></div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const sendBtn = document.getElementById('sendBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const result = document.getElementById('result');
        const fileName = document.getElementById('fileName');
        let selectedFile = null;

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.name.endsWith('.csv')) {
                selectFile(file);
            }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files[0]) selectFile(fileInput.files[0]);
        });

        function selectFile(file) {
            selectedFile = file;
            fileName.textContent = file.name;
            sendBtn.disabled = false;
            result.style.display = 'none';
            progressContainer.style.display = 'none';
        }

        sendBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            sendBtn.disabled = true;
            result.style.display = 'none';
            progressContainer.style.display = 'block';
            progressFill.style.width = '0%';
            progressText.textContent = 'Uploading file...';

            const formData = new FormData();
            formData.append('file', selectedFile);

            let uploading = true;

            try {
                const res = await fetch('/upload', { method: 'POST', body: formData });
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const data = JSON.parse(line.slice(6));

                        if (data.status === 'progress') {
                            if (uploading) {
                                uploading = false;
                                progressText.textContent = 'File uploaded. Sending to Kafka...';
                            }
                            progressFill.style.width = data.percent + '%';
                            progressText.textContent = `Sending to Kafka... ${data.rows_sent.toLocaleString()} rows (${data.percent}%)`;
                        } else if (data.status === 'done') {
                            progressFill.style.width = '100%';
                            progressText.textContent = `Sent ${data.rows_sent.toLocaleString()} rows (100%)`;
                            setTimeout(() => {
                                progressContainer.style.display = 'none';
                                result.className = 'result success';
                                result.style.display = 'block';
                                result.textContent = `Done! Sent ${data.rows_sent.toLocaleString()} rows from "${data.filename}" to topic "${data.topic}"`;
                            }, 500);
                        }
                    }
                }
            } catch (err) {
                progressContainer.style.display = 'none';
                result.className = 'result error';
                result.style.display = 'block';
                result.textContent = 'Connection error: ' + err.message;
            }

            sendBtn.disabled = false;
        });
    </script>
</body>
</html>
