# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 1.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: CSV to Kafka
    application: csv-to-kafka
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: csvtokafka
    network:
      ports:
        - port: 80
          targetPort: 80
    variables:
      - name: output
        inputType: OutputTopic
        description: Kafka topic to send CSV rows to
        required: true
        value: csv-data

# This section describes the Topics of the data pipeline
topics:
  - name: csv-data
    configuration:
      partitions: 1
      replicationFactor: 1
      retentionInMinutes: 1440
      retentionInBytes: 52428800
